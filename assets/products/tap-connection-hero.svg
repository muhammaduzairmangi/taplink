<svg viewBox="0 0 560 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroIllTitle">
  <title id="heroIllTitle">Illustration of a phone tapping an NFC card, connecting to a Google review, WhatsApp and menu icon</title>
  <defs>
    <style>
      .stroke{fill:none;stroke:#16181B;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
      .strokeAccent{fill:none;stroke:#146356;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
      .fillCard{fill:#FAFAF8;stroke:#16181B;stroke-width:2.5;}
      .fillDot{fill:#146356;}
      .fillPale{fill:#EDEEEA;}
    </style>
  </defs>

  <!-- phone -->
  <rect x="60" y="60" width="150" height="290" rx="20" class="fillCard"/>
  <rect x="80" y="90" width="110" height="200" rx="4" class="fillPale"/>
  <circle cx="135" cy="325" r="5" class="fillDot"/>

  <!-- card -->
  <rect x="300" y="230" width="220" height="130" rx="14" class="fillCard"/>
  <circle cx="470" cy="260" r="10" class="strokeAccent"/>
  <line x1="330" y1="300" x2="440" y2="300" class="stroke"/>
  <line x1="330" y1="320" x2="400" y2="320" class="stroke"/>

  <!-- tap arcs -->
  <path d="M235 200 Q260 220 235 240" class="strokeAccent"/>
  <path d="M255 185 Q295 220 255 255" class="strokeAccent"/>

  <!-- destination icons -->
  <g transform="translate(300,60)">
    <circle cx="20" cy="20" r="20" class="fillPale"/>
    <text x="20" y="27" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#146356">G</text>
  </g>
  <g transform="translate(370,40)">
    <circle cx="20" cy="20" r="20" class="fillPale"/>
    <path d="M12 24a10 10 0 1 1 16 6l2 6-6-2a10 10 0 0 1-12-10z" class="stroke"/>
  </g>
  <g transform="translate(440,70)">
    <circle cx="20" cy="20" r="20" class="fillPale"/>
    <rect x="10" y="10" width="20" height="20" class="stroke"/>
    <line x1="10" y1="17" x2="30" y2="17" class="stroke"/>
  </g>

  <path d="M300 90 Q280 150 320 235" class="stroke" stroke-dasharray="4 6"/>
  <path d="M390 70 Q360 140 330 235" class="stroke" stroke-dasharray="4 6"/>
  <path d="M460 100 Q420 160 350 240" class="stroke" stroke-dasharray="4 6"/>
</svg>
